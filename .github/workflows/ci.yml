name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/carbon-registry
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/carbon-registry/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/carbon-registry/Cargo.lock') }}

      # soroban-sdk 22 testutils pull ed25519-dalek 3.x transitively, which
      # currently fails to compile against ChaCha20Rng. Pin to the 2.x line.
      - name: Pin ed25519-dalek
        run: cargo update ed25519-dalek@3.0.0 --precise 2.1.1 || true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build wasm
        run: cargo build --release --target wasm32v1-none

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
